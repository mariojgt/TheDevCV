<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>The Dev CV — ATS-compliant CV builder for developers</title>
    <meta name="description" content="The Dev CV is a fast, opinionated CV builder for developers. Drop in a job description, tailor your experience with AI, and export an ATS-compliant PDF in one click." />
    <meta name="keywords" content="ATS CV builder, developer CV, resume builder for developers, ATS-compliant resume, AI resume tailoring, cover letter generator, software engineer CV, tech resume, job application tracker" />
    <meta name="author" content="The Dev Realm" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#0d9668" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://cv.thedevrealm.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#0d9668" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Dev CV" />
    <meta property="og:title" content="The Dev CV — ATS-compliant CV builder for developers" />
    <meta property="og:description" content="A fast, opinionated CV builder for developers. Drop in a job description, tailor your experience with AI, and export an ATS-compliant PDF in one click." />
    <meta property="og:url" content="https://cv.thedevrealm.com/" />
    <meta property="og:image" content="https://cv.thedevrealm.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://cv.thedevrealm.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Dev CV — craft a CV that ships past every ATS filter" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Dev CV — ATS-compliant CV builder for developers" />
    <meta name="twitter:description" content="AI-tailored CVs and cover letters for developers. Export an ATS-compliant PDF in one click." />
    <meta name="twitter:image" content="https://cv.thedevrealm.com/og-image.png" />
    <meta name="twitter:image:alt" content="The Dev CV — craft a CV that ships past every ATS filter" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Teko:wght@300;400;500;600;700&display=swap" />

    <!-- Structured data: SoftwareApplication + Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "The Dev CV",
          "url": "https://cv.thedevrealm.com/",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "description": "ATS-compliant CV builder for developers with AI-powered tailoring, cover-letter generation, and a job-application pipeline.",
          "offers": [
            { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "GBP" },
            { "@type": "Offer", "name": "Pro",  "price": "8", "priceCurrency": "GBP" }
          ],
          "featureList": [
            "100% ATS-compliant PDF export",
            "AI tailoring from job descriptions",
            "Cover-letter generator",
            "GitHub / Markdown / PDF import",
            "Job application pipeline"
          ],
          "publisher": { "@id": "https://thedevrealm.com/#org" }
        },
        {
          "@type": "Organization",
          "@id": "https://thedevrealm.com/#org",
          "name": "The Dev Realm",
          "url": "https://thedevrealm.com/"
        },
        {
          "@type": "WebSite",
          "url": "https://cv.thedevrealm.com/",
          "name": "The Dev CV",
          "publisher": { "@id": "https://thedevrealm.com/#org" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
